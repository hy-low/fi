      }

      .cell-text {
        font-family: Consolas, monospace;
        font-size: 15px;
        fill: #111;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .arrow-line {
        stroke: #333;
        stroke-width: 2;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

