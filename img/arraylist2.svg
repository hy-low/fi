<svg width="500" height="90" xmlns="http://www.w3.org/2000/svg">
  <style>
    .addr {
      font: 14px monospace;
      fill: #555;
    }

    .varname {
      font: 20px monospace;
      text-anchor:middle;
    }

    .empty {
      fill: #dddddd;
      stroke: black;
      stroke-width: 2;
    }

    .var0, .var1, .var2, .var3 {
      fill: #9999ee;
      stroke: black;
      stroke-width: 2;
    }

    .brace {
      stroke: #333;
      stroke-width: 2;
      fill: none;
    }
  </style>

  <rect x="150" y="20" width="50" height="50" class="var0"/>
  <rect x="200" y="20" width="50" height="50" class="var0"/>
  <rect x="250" y="20" width="50" height="50" class="var0"/>
  <rect x="300" y="20" width="50" height="50" class="var0"/>

  <text x="175" y="50" class="varname">1</text>
  <text x="225" y="50" class="varname">2</text>
  <text x="275" y="50" class="varname">3</text>
  <text x="325" y="50" class="varname">4</text>

</svg>
