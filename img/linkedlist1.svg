<svg width="860" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowNext" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb" />
    </marker>

    <marker id="arrowPrev" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626" />
    </marker>

    <style>
      .node {
        fill: #f8fafc;
        stroke: #0f172a;
        stroke-width: 2;
      }

      .field-line {
        stroke: #0f172a;
        stroke-width: 1.5;
      }

      .label {
        font-family: monospace;
        font-size: 16px;
        fill: #0f172a;
      }

      .next {
        stroke: #2563eb;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowNext);
      }

      .prev {
        stroke: #dc2626;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowPrev);
      }

      .null {
        font-family: monospace;
        font-size: 15px;
        fill: #475569;
      }
    </style>
  </defs>

  <!-- Solmu 1 -->
  <rect x="100" y="60" width="150" height="120" rx="8" class="node" />
  <line x1="100" y1="100" x2="250" y2="100" class="field-line" />
  <line x1="100" y1="140" x2="250" y2="140" class="field-line" />

  <text x="115" y="85" class="label">value: 1</text>
  <text x="115" y="125" class="label">prev</text>
  <text x="115" y="165" class="label">next</text>

  <!-- Solmu 2 -->
  <rect x="350" y="60" width="150" height="120" rx="8" class="node" />
  <line x1="350" y1="100" x2="500" y2="100" class="field-line" />
  <line x1="350" y1="140" x2="500" y2="140" class="field-line" />

  <text x="365" y="85" class="label">value: 2</text>
  <text x="365" y="125" class="label">prev</text>
  <text x="365" y="165" class="label">next</text>

  <!-- Solmu 3 -->
  <rect x="600" y="60" width="150" height="120" rx="8" class="node" />
  <line x1="600" y1="100" x2="750" y2="100" class="field-line" />
  <line x1="600" y1="140" x2="750" y2="140" class="field-line" />

  <text x="615" y="85" class="label">value: 3</text>
  <text x="615" y="125" class="label">prev</text>
  <text x="615" y="165" class="label">next</text>

  <!-- next-linkit -->
  <path d="M250 160 C285 195, 315 195, 350 160" class="next" />
  <path d="M500 160 C535 195, 565 195, 600 160" class="next" />

  <!-- prev-linkit -->
  <path d="M350 120 C315 85, 285 85, 250 120" class="prev" />
  <path d="M600 120 C565 85, 535 85, 500 120" class="prev" />

  <!-- NULL-linkit -->
  <path d="M100 120 L55 120" class="prev" />
  <text x="10" y="125" class="null">NULL</text>

  <path d="M750 160 L805 160" class="next" />
  <text x="815" y="165" class="null">NULL</text>
</svg>
